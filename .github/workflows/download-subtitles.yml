name: Download existing YouTube subtitles

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "YouTube playlist URL"
        required: true
        type: string
      languages:
        description: "Subtitle languages (comma-separated). Example: ru,en"
        required: false
        default: "ru,en"
        type: string

permissions:
  contents: read

jobs:
  subtitles:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp
          yt-dlp --version

      - name: Download existing subtitles only
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          set -e
          mkdir -p output

          echo "Playlist: $PLAYLIST_URL"
          echo "Languages: $LANGUAGES"
          echo ""

          # One call for the whole playlist — fewer requests, less rate-limiting
          # --sleep-requests helps avoid HTTP 429 from YouTube
          yt-dlp \
            --skip-download \
            --write-subs \
            --write-auto-subs \
            --sub-langs "$LANGUAGES" \
            --sub-format "srt/vtt/best" \
            --convert-subs srt \
            --ignore-errors \
            --sleep-requests 1 \
            --sleep-interval 1 \
            --max-sleep-interval 3 \
            -o "output/%(playlist_index)03d - %(title)s.%(ext)s" \
            "$PLAYLIST_URL" \
            2>&1 | tee yt-dlp.log || true

          echo ""
          echo "=== Files in output/ ==="
          find output -type f | sort || true
          echo ""

          # Build report.txt
          {
            echo "Playlist: $PLAYLIST_URL"
            echo "Languages: $LANGUAGES"
            echo ""
            if [ -d output ] && [ "$(find output -type f 2>/dev/null | wc -l)" -gt 0 ]; then
              echo "Found subtitle files:"
              find output -type f | sort | while read -r f; do
                echo "  [FOUND] $f"
              done
            else
              echo "No subtitle files were downloaded."
              echo ""
              echo "Possible reasons:"
              echo "  - videos have no subtitles in the requested languages"
              echo "  - YouTube rate-limited the runner (HTTP 429)"
              echo "  - playlist URL is invalid or private"
              echo ""
              echo "Last lines of yt-dlp log:"
              tail -40 yt-dlp.log || true
            fi
          } > report.txt

          cat report.txt

      - name: Create ZIP archive
        run: |
          if [ -d output ] && [ "$(find output -type f | wc -l)" -gt 0 ]; then
            zip -r subtitles.zip output report.txt yt-dlp.log
            echo "ZIP created with subtitle files."
          else
            echo "No subtitle files were found."
            zip subtitles.zip report.txt yt-dlp.log
          fi

      - name: Upload subtitles artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-subtitles
          path: subtitles.zip
          retention-days: 7
