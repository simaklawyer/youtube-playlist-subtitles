name: Download existing YouTube subtitles

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "YouTube playlist URL"
        required: true
        type: string
      languages:
        description: "Original subtitle languages, for example ru,en"
        required: false
        default: "ru,en"
        type: string

permissions:
  contents: read

jobs:
  subtitles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp

      - name: Download existing subtitles only
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          mkdir -p output
          touch report.txt

          yt-dlp \
            --flat-playlist \
            --dump-single-json \
            "$PLAYLIST_URL" > playlist.json

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          playlist_url = os.environ["PLAYLIST_URL"]
          languages = os.environ["LANGUAGES"]
          output = Path("output")
          report = Path("report.txt")

          data = json.loads(Path("playlist.json").read_text())
          entries = data.get("entries", [])

          with report.open("w", encoding="utf-8") as log:
              log.write(f"Playlist: {playlist_url}\n")
              log.write(f"Languages: {languages}\n\n")

              for index, entry in enumerate(entries, start=1):
                  if not entry:
                      continue

                  video_id = entry.get("id")
                  title = entry.get("title") or video_id
                  video_url = f"https://www.youtube.com/watch?v={video_id}"

                  safe_title = "".join(
                      c if c.isalnum() or c in " ._-()" else "_"
                      for c in title
                  ).strip()

                  prefix = f"{index:03d} - {safe_title}"

                  before = set(output.glob(f"{prefix}*"))

                  command = [
                      "yt-dlp",
                      "--skip-download",
                      "--write-subs",
                      "--write-auto-subs",
                      "--sub-langs", languages,
                      "--sub-format", "srt/vtt/best",
                      "--convert-subs", "srt",
                      "--ignore-errors",
                      "--no-warnings",
                      "-o", str(output / f"{prefix}.%(ext)s"),
                      video_url,
                  ]

                  result = subprocess.run(
                      command,
                      text=True,
                      capture_output=True
                  )

                  after = set(output.glob(f"{prefix}*"))
                  new_files = sorted(after - before)

                  if new_files:
                      names = ", ".join(
                          str(path.relative_to(output)) for path in new_files
                      )
                      log.write(f"[FOUND] {index:03d} {title}: {names}\n")
                  else:
                      log.write(f"[SKIPPED] {index:03d} {title}: no subtitles\n")

                  if result.returncode != 0 and not new_files:
                      log.write(
                          f"[INFO] yt-dlp returned code {result.returncode}\n"
                      )
          PY

      - name: Create ZIP archive
        run: |
          if [ -d output ] && [ "$(find output -type f | wc -l)" -gt 0 ]; then
            zip -r subtitles.zip output report.txt
          else
            echo "No subtitle files were found."
            zip subtitles.zip report.txt
          fi

      - name: Upload subtitles artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-subtitles
          path: subtitles.zip
          retention-days: 7
